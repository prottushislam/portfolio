<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#0f172a;
        color:white;
        font-family:Arial, sans-serif;
        text-align:center;
        padding:20px;
    }

    .maintenance{
        max-width:600px;
    }

    .icon{
        font-size:4rem;
        margin-bottom:20px;
    }

    h1{
        font-size:2.5rem;
        margin-bottom:15px;
    }

    p{
        font-size:1.1rem;
        color:#cbd5e1;
        line-height:1.6;
    }
</style>
</head>
<body>

<div class="maintenance">
    <div class="icon">🚧</div>
    <h1>Portfolio Under Maintenance</h1>
    <p>
        I'm currently improving my portfolio and adding new projects.
        Please check back soon. Thank you for your patience.
    </p>
</div>

</body>
</html>
